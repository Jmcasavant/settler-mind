name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests, in-world game tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The mod targets Java 17 bytecode (Homestead runtime); the build itself runs on JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Guard rule 8 in AGENTS.md: no dependency may raise Fabric Loader above the pin.
      - name: Check Fabric Loader pin
        run: |
          expected=$(grep '^loader_version=' gradle.properties | cut -d= -f2)
          resolved=$(./gradlew -q dependencies --configuration runtimeClasspath | grep -oE 'net.fabricmc:fabric-loader:[^ ]+( -> [^ ]+)?' | sort -u | sed -E 's/.*(-> |:)//')
          echo "pinned=$expected resolved=$resolved"
          test "$resolved" = "$expected"

      # `build` runs `test` (mind unit tests) and `runGametest` (headless server) via `check`.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-eval-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/junit-gametest.xml
            build/gametest/logs/
            build/eval/
          if-no-files-found: ignore

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: settlermind-jar
          path: build/libs/*.jar
