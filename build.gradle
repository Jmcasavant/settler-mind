plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { name = 'FabricKotlin'; url = 'https://maven.fabricmc.net/' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        settlermind {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        // Headless dedicated server that runs every @GameTest and exits non-zero on failure.
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit-gametest.xml"
            runDir "build/gametest"
        }
    }
}

configurations {
    bundled
    implementation.extendsFrom bundled
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Kotlin runtime comes from Fabric Language Kotlin (present in most packs); we never bundle our own.
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.flk_version}"

    // Claude backend: official Anthropic Java SDK. Its non-Kotlin libraries are nested in our jar.
    bundled "com.anthropic:anthropic-java:${project.anthropic_version}"
    // Nested (jar-in-jar) runtime libraries of the SDK. Kotlin, slf4j and JetBrains annotations
    // are provided by Fabric Language Kotlin / Minecraft. Regenerate with:
    //   ./gradlew dependencies --configuration bundled
    include "com.anthropic:anthropic-java:3.8.0"
    include "com.anthropic:anthropic-java-core:3.8.0"
    include "com.anthropic:anthropic-java-client-okhttp:3.8.0"
    include "com.fasterxml.jackson.core:jackson-annotations:2.19.4"
    include "com.fasterxml.jackson.core:jackson-core:2.19.4"
    include "com.fasterxml.jackson.core:jackson-databind:2.19.4"
    include "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.19.4"
    include "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.4"
    include "com.fasterxml.jackson.module:jackson-module-kotlin:2.19.4"
    include "com.fasterxml:classmate:1.7.0"
    include "com.github.victools:jsonschema-generator:4.38.0"
    include "com.github.victools:jsonschema-module-jackson:4.38.0"
    include "com.github.victools:jsonschema-module-swagger-2:4.38.0"
    include "com.squareup.okhttp3:okhttp:4.12.0"
    include "com.squareup.okio:okio-jvm:3.6.0"
    include "com.squareup.okio:okio:3.6.0"
    include "com.standardwebhooks:standardwebhooks:1.2.0"
    include "io.opentelemetry:opentelemetry-api:1.62.0"
    include "io.opentelemetry:opentelemetry-common:1.62.0"
    include "io.opentelemetry:opentelemetry-context:1.62.0"
    include "io.swagger.core.v3:swagger-annotations:2.2.50"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test { useJUnitPlatform() }

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 17 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }

// Run game tests as part of `check`.
check.dependsOn("runGametest")
